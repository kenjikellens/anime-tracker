<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASCAL - Top Kijklijst Drag & Drop Mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .mockup-app-layout {
            display: flex;
            flex: 1;
            position: relative;
            min-height: calc(100vh - 72px);
        }

        .mockup-main-content {
            flex: 1;
            padding: 24px 32px;
            transition: margin-right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mockup-main-content.sidebar-open {
            margin-right: 380px;
        }

        /* Top Queue Sidebar Drawer */
        .queue-sidebar {
            position: fixed;
            top: 72px;
            right: 0;
            bottom: 0;
            width: 380px;
            background: var(--surface);
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            z-index: 100;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 1px solid var(--surface-2);
        }

        .queue-sidebar.open {
            transform: translateX(0);
        }

        .queue-header {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--surface-2);
            background: var(--surface-card);
        }

        .queue-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .queue-header-title h3 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
        }

        .queue-count-badge {
            background: var(--primary);
            color: var(--bg);
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .queue-close-btn {
            background: var(--surface-2);
            border: none;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .queue-close-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .queue-subtext {
            padding: 12px 24px;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--surface);
            border-bottom: 1px solid var(--surface-2);
            line-height: 1.4;
        }

        /* Add Section at Top of Sidebar */
        .queue-add-section {
            padding: 16px 20px;
            border-bottom: 1px solid var(--surface-2);
            background: var(--surface-card);
            position: relative;
        }

        .queue-add-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .queue-add-input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            background: var(--surface-2);
            border: 1px solid transparent;
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            outline: none;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .queue-add-input:focus {
            background: var(--surface-hover);
            border-color: var(--primary);
        }

        .queue-add-icon {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 800;
            pointer-events: none;
        }

        /* Autocomplete dropdown list */
        .queue-autocomplete-list {
            position: absolute;
            top: 100%;
            left: 20px;
            right: 20px;
            background: var(--surface);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            border: 1px solid var(--surface-2);
            max-height: 220px;
            overflow-y: auto;
            z-index: 110;
            display: none;
            margin-top: 4px;
        }

        .queue-autocomplete-list.visible {
            display: block;
        }

        .queue-autocomplete-item {
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.12s ease;
        }

        .queue-autocomplete-item:hover {
            background: var(--surface-hover);
        }

        .queue-autocomplete-empty {
            padding: 12px 14px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }

        /* Drag & Drop Queue List */
        .queue-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .queue-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--surface-card);
            border-radius: 10px;
            transition: background 0.15s ease, opacity 0.15s ease;
            cursor: grab;
            user-select: none;
            border: 2px solid transparent;
        }

        .queue-item:hover {
            background: var(--surface-hover);
        }

        .queue-item.dragging {
            opacity: 0.35;
            cursor: grabbing;
            background: var(--surface-2);
            border: 2px dashed var(--primary);
        }

        .queue-item.drag-over {
            border-top: 2px solid var(--primary);
        }

        .queue-item.drag-over-bottom {
            border-bottom: 2px solid var(--primary);
        }

        /* Drag Handle */
        .queue-drag-handle {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1;
            cursor: grab;
            display: flex;
            align-items: center;
            opacity: 0.6;
            transition: opacity 0.15s ease;
        }

        .queue-item:hover .queue-drag-handle {
            opacity: 1;
        }

        .queue-item-rank {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-muted);
            width: 22px;
            text-align: center;
        }

        .queue-item-rank.rank-top {
            color: #ff9800;
        }

        .queue-item-title {
            flex: 1;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .queue-item-actions {
            display: flex;
            align-items: center;
        }

        .queue-action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 26px;
            height: 26px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
            font-size: 13px;
        }

        .queue-action-btn:hover {
            background: var(--surface-2);
            color: #f44336;
        }

        .queue-empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        /* Trigger button in header */
        .queue-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--surface-2);
            color: var(--text);
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .queue-toggle-btn:hover {
            background: var(--surface-hover);
        }

        .queue-toggle-btn.active {
            background: var(--primary);
            color: var(--bg);
        }

        /* Card queue status button */
        .card-queue-btn {
            background: var(--surface-2);
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .card-queue-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .card-queue-btn.in-queue {
            background: var(--primary);
            color: var(--bg);
        }
    </style>
</head>
<body>

    <!-- Header with Toggle Button -->
    <header class="header-main">
        <div class="header-content">
            <div class="header-left">
                <h1 class="logo-rascal"><span class="ras">RAS</span><span class="cal">CAL</span></h1>
            </div>
            <div class="header-center">
                <div class="search-bar">
                    <input type="text" id="search-input" class="ultimate-hover-effect" placeholder="Zoek in je lijst...">
                </div>
            </div>
            <div class="header-right" style="display: flex; gap: 12px; align-items: center;">
                <button class="queue-toggle-btn active" id="queue-toggle-btn" title="Open Mijn Kijkvolgorde">
                    <span>📋 Mijn Top Kijklijst</span>
                    <span class="queue-count-badge" id="header-queue-count">4</span>
                </button>
                <button id="theme-toggle" class="ultimate-hover-effect" title="Switch theme" style="background: var(--surface-2); border: none; padding: 8px 12px; border-radius: 8px; color: var(--text); cursor: pointer;">
                    Thema
                </button>
            </div>
        </div>
    </header>

    <div class="mockup-app-layout">
        <!-- Main Content with Toolbar & Cards -->
        <div class="mockup-main-content sidebar-open" id="main-content">
            <div class="toolbar" style="margin-bottom: 24px;">
                <div class="filter-group">
                    <button class="filter-btn ultimate-hover-effect">Alles</button>
                    <button class="filter-btn active ultimate-hover-effect">Te Bekijken (10)</button>
                    <button class="filter-btn ultimate-hover-effect">Bezig</button>
                    <button class="filter-btn ultimate-hover-effect">Bekeken</button>
                </div>
                <div class="sort-group">
                    <select id="mock-sort-select" class="app-dropdown" style="padding: 8px 14px; border-radius: 8px; background: var(--surface-2); color: var(--text); border: none;">
                        <option value="queue" selected>Sorteer: Mijn Kijkvolgorde (#1 → Laatst)</option>
                        <option value="title-asc">Titel A→Z</option>
                    </select>
                </div>
            </div>

            <!-- Cards Grid -->
            <div class="status-column" id="mock-cards-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;">
                <!-- Filled dynamically by JavaScript -->
            </div>
        </div>

        <!-- Right Ranked Queue Sidebar -->
        <aside class="queue-sidebar open" id="queue-sidebar">
            <div class="queue-header">
                <div class="queue-header-title">
                    <h3>Volgende om te Bekijken</h3>
                    <span class="queue-count-badge" id="sidebar-queue-count">4</span>
                </div>
                <button class="queue-close-btn" id="queue-close-btn" title="Sluit sidebar">✕</button>
            </div>

            <div class="queue-subtext">
                Sleep items (<strong>Drag & Drop</strong>) om de volgorde te wijzigen. Alleen geconfigureerde series staan in deze lijst.
            </div>

            <!-- Search & Add Section -->
            <div class="queue-add-section">
                <div class="queue-add-input-wrap">
                    <span class="queue-add-icon">+</span>
                    <input type="text" class="queue-add-input" id="queue-search-add" placeholder="Serie toevoegen aan Top lijst..." autocomplete="off">
                </div>
                <div class="queue-autocomplete-list" id="queue-autocomplete">
                    <!-- Dynamic autocomplete matches -->
                </div>
            </div>

            <!-- Draggable List -->
            <div class="queue-list" id="queue-list-container">
                <!-- Ranked Items with Drag Handles -->
            </div>
        </aside>
    </div>

    <script>
        // Mock dataset of anime in "Te Bekijken"
        let mockAnime = [
            { id: "steins-gate", title: "Steins;Gate", inQueue: true, rank: 1 },
            { id: "fate-stay-night", title: "Fate/stay night", inQueue: true, rank: 2 },
            { id: "saekano", title: "Saekano: How to Raise a Boring Girlfriend", inQueue: true, rank: 3 },
            { id: "my-awkward-senpai", title: "My Awkward Senpai", inQueue: true, rank: 4 },
            { id: "banished-from-the-heros-party", title: "Banished from the Hero's Party", inQueue: false, rank: null },
            { id: "my-stepmoms-daughter-is-my-ex", title: "My Stepmom's Daughter Is My Ex", inQueue: false, rank: null },
            { id: "black-summoner", title: "Black Summoner", inQueue: false, rank: null },
            { id: "higehiro", title: "Higehiro: After Being Rejected, I Shaved and Took in a High School Runaway", inQueue: false, rank: null },
            { id: "orange", title: "Orange", inQueue: false, rank: null },
            { id: "a-silent-voice", title: "A Silent Voice (Koe no Katachi)", inQueue: false, rank: null }
        ];

        let draggedItemId = null;

        // Renders the ranked sidebar with Drag-and-Drop
        function renderQueue() {
            const queueItems = mockAnime.filter(a => a.inQueue).sort((a, b) => a.rank - b.rank);
            const container = document.getElementById('queue-list-container');
            const headerCount = document.getElementById('header-queue-count');
            const sidebarCount = document.getElementById('sidebar-queue-count');

            headerCount.textContent = queueItems.length;
            sidebarCount.textContent = queueItems.length;

            if (queueItems.length === 0) {
                container.innerHTML = `
                    <div class="queue-empty-state">
                        <p>Nog geen anime in je Top Kijklijst.</p>
                        <p style="font-size: 11px;">Typ een serienaam hierboven of klik op "+ Naar Top Lijst" op een animekaart.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = queueItems.map((anime, index) => {
                const rank = index + 1;
                anime.rank = rank;
                const isTop = rank === 1;
                return `
                    <div class="queue-item" draggable="true" data-id="${anime.id}" data-index="${index}">
                        <div class="queue-drag-handle" title="Sleep om volgorde te veranderen">⋮⋮</div>
                        <span class="queue-item-rank ${isTop ? 'rank-top' : ''}">#${rank}</span>
                        <span class="queue-item-title" title="${anime.title}">${anime.title}</span>
                        <div class="queue-item-actions">
                            <button class="queue-action-btn" onclick="removeFromQueue('${anime.id}')" title="Verwijderen uit Top lijst">✕</button>
                        </div>
                    </div>
                `;
            }).join('');

            setupDragAndDrop();
            renderCards();
        }

        // HTML5 Drag and Drop Handlers
        function setupDragAndDrop() {
            const items = document.querySelectorAll('.queue-item');

            items.forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    draggedItemId = item.getAttribute('data-id');
                    item.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', draggedItemId);
                });

                item.addEventListener('dragend', () => {
                    item.classList.remove('dragging');
                    items.forEach(i => {
                        i.classList.remove('drag-over');
                        i.classList.remove('drag-over-bottom');
                    });
                    draggedItemId = null;
                });

                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';

                    const rect = item.getBoundingClientRect();
                    const offset = e.clientY - rect.top;
                    if (offset < rect.height / 2) {
                        item.classList.add('drag-over');
                        item.classList.remove('drag-over-bottom');
                    } else {
                        item.classList.add('drag-over-bottom');
                        item.classList.remove('drag-over');
                    }
                });

                item.addEventListener('dragleave', () => {
                    item.classList.remove('drag-over');
                    item.classList.remove('drag-over-bottom');
                });

                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const targetId = item.getAttribute('data-id');
                    if (!draggedItemId || draggedItemId === targetId) return;

                    const queue = mockAnime.filter(a => a.inQueue).sort((a, b) => a.rank - b.rank);
                    const fromIndex = queue.findIndex(a => a.id === draggedItemId);
                    let toIndex = queue.findIndex(a => a.id === targetId);

                    const rect = item.getBoundingClientRect();
                    const offset = e.clientY - rect.top;
                    if (offset >= rect.height / 2) {
                        toIndex += 1;
                    }

                    if (fromIndex < 0 || toIndex < 0) return;

                    // Reorder in array
                    const [movedItem] = queue.splice(fromIndex, 1);
                    if (toIndex > fromIndex) toIndex -= 1;
                    queue.splice(toIndex, 0, movedItem);

                    // Reassign sequential ranks
                    queue.forEach((a, idx) => a.rank = idx + 1);
                    renderQueue();
                });
            });
        }

        // Autocomplete Search & Add
        const searchAddInput = document.getElementById('queue-search-add');
        const autocompleteList = document.getElementById('queue-autocomplete');

        searchAddInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                autocompleteList.classList.remove('visible');
                return;
            }

            const unqueued = mockAnime.filter(a => !a.inQueue && a.title.toLowerCase().includes(query));
            if (unqueued.length === 0) {
                autocompleteList.innerHTML = `<div class="queue-autocomplete-empty">Geen niet-toegevoegde series gevonden.</div>`;
            } else {
                autocompleteList.innerHTML = unqueued.map(a => `
                    <div class="queue-autocomplete-item" onclick="addToQueueFromSearch('${a.id}')">
                        <span>${a.title}</span>
                        <span style="color: var(--primary); font-weight: 800;">+ Toevoegen</span>
                    </div>
                `).join('');
            }
            autocompleteList.classList.add('visible');
        });

        searchAddInput.addEventListener('focus', () => {
            if (searchAddInput.value.trim()) autocompleteList.classList.add('visible');
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.queue-add-section')) {
                autocompleteList.classList.remove('visible');
            }
        });

        window.addToQueueFromSearch = function(id) {
            const currentCount = mockAnime.filter(a => a.inQueue).length;
            const item = mockAnime.find(a => a.id === id);
            if (item) {
                item.inQueue = true;
                item.rank = currentCount + 1;
                searchAddInput.value = '';
                autocompleteList.classList.remove('visible');
                renderQueue();
            }
        };

        // Remove from queue
        window.removeFromQueue = function(id) {
            const item = mockAnime.find(a => a.id === id);
            if (item) {
                item.inQueue = false;
                item.rank = null;
                const remaining = mockAnime.filter(a => a.inQueue).sort((a, b) => a.rank - b.rank);
                remaining.forEach((a, idx) => a.rank = idx + 1);
                renderQueue();
            }
        };

        // Toggle queue status from card
        window.toggleQueue = function(id) {
            const item = mockAnime.find(a => a.id === id);
            if (!item) return;

            if (item.inQueue) {
                removeFromQueue(id);
            } else {
                const currentCount = mockAnime.filter(a => a.inQueue).length;
                item.inQueue = true;
                item.rank = currentCount + 1;
                renderQueue();
            }
        };

        // Renders mock anime cards
        function renderCards() {
            const container = document.getElementById('mock-cards-container');
            const sortMode = document.getElementById('mock-sort-select').value;

            let displayList = [...mockAnime];
            if (sortMode === 'queue') {
                displayList.sort((a, b) => {
                    if (a.inQueue && b.inQueue) return a.rank - b.rank;
                    if (a.inQueue) return -1;
                    if (b.inQueue) return 1;
                    return a.title.localeCompare(b.title);
                });
            } else if (sortMode === 'title-asc') {
                displayList.sort((a, b) => a.title.localeCompare(b.title));
            }

            container.innerHTML = displayList.map(anime => {
                return `
                    <div class="anime-card ultimate-hover-effect" style="background: var(--surface-card); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; min-height: 120px;">
                        <div>
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px;">
                                <strong style="font-size: 14px; color: var(--text);">${anime.title}</strong>
                                ${anime.inQueue ? `<span style="font-size: 11px; font-weight: 800; color: #ff9800; background: rgba(255,152,0,0.15); padding: 2px 6px; border-radius: 6px;">#${anime.rank}</span>` : ''}
                            </div>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px;">
                            <span style="font-size: 12px; color: var(--text-muted);">Te Bekijken</span>
                            <button class="card-queue-btn ${anime.inQueue ? 'in-queue' : ''}" onclick="toggleQueue('${anime.id}')">
                                ${anime.inQueue ? '✓ In Top Lijst' : '+ Naar Top Lijst'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Sidebar toggle
        const toggleBtn = document.getElementById('queue-toggle-btn');
        const closeBtn = document.getElementById('queue-close-btn');
        const sidebar = document.getElementById('queue-sidebar');
        const mainContent = document.getElementById('main-content');

        function toggleSidebar(show) {
            const isOpen = show !== undefined ? show : !sidebar.classList.contains('open');
            sidebar.classList.toggle('open', isOpen);
            mainContent.classList.toggle('sidebar-open', isOpen);
            toggleBtn.classList.toggle('active', isOpen);
        }

        toggleBtn.addEventListener('click', () => toggleSidebar());
        closeBtn.addEventListener('click', () => toggleSidebar(false));
        document.getElementById('mock-sort-select').addEventListener('change', renderCards);

        // Theme toggle
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const html = document.documentElement;
            const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
        });

        // Initial render
        renderQueue();
    </script>
</body>
</html>
