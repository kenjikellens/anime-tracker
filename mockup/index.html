<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASCAL - Type & Badge Styles Mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Directe referentie naar de echte CSS van het project -->
    <link rel="stylesheet" href="../css/styles.css">

    <style>
        /* Enkel layout styling voor het mockup overzicht */
        body {
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--surface-2);
        }

        .theme-btn {
            background: var(--surface-2);
            color: var(--text);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .section {
            background: var(--surface-card);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>RASCAL — Style Showcase Mockup</h1>
        <button class="theme-btn" id="toggle-theme">Thema: Dark</button>
    </header>

    <!-- SECTION 1: ITEM TYPES (Media Formats) -->
    <div class="section">
        <div class="section-title">Item Types (Media Formaten)</div>
        <div class="badge-grid">
            <span class="item-type-badge type-serie">SERIE</span>
            <span class="item-type-badge type-film">FILM</span>
            <span class="item-type-badge type-ova">OVA</span>
            <span class="item-type-badge type-special">SPECIAL</span>
            <span class="item-type-badge type-ona">ONA</span>
        </div>
    </div>

    <!-- SECTION 2: STATUS FILTER BUTTONS & PILLS -->
    <div class="section">
        <div class="section-title">Status Pills & Filter Knoppen</div>
        <div class="badge-grid">
            <button class="filter-btn active ultimate-hover-effect">Alles</button>
            <button class="filter-btn ultimate-hover-effect">Airing</button>
            <button class="filter-btn ultimate-hover-effect">Upcoming</button>
            <button class="filter-btn ultimate-hover-effect">Te Bekijken</button>
            <button class="filter-btn ultimate-hover-effect">Bezig</button>
            <button class="filter-btn ultimate-hover-effect">Bekeken</button>
        </div>
    </div>

    <!-- SECTION 3: RATING BADGES -->
    <div class="section">
        <div class="section-title">Rating Badges (Beoordelingen)</div>
        <div class="badge-grid">
            <span class="rating-badge ultimate-hover-effect r-cinema" data-rating-tier="cinema">★ 10.0</span>
            <span class="rating-badge ultimate-hover-effect r-awesome" data-rating-tier="awesome">★ 9.0</span>
            <span class="rating-badge ultimate-hover-effect r-great" data-rating-tier="great">★ 8.0</span>
            <span class="rating-badge ultimate-hover-effect r-good" data-rating-tier="good">★ 7.0</span>
            <span class="rating-badge ultimate-hover-effect r-regular" data-rating-tier="regular">★ 6.0</span>
            <span class="rating-badge ultimate-hover-effect r-bad" data-rating-tier="bad">★ 5.0</span>
            <span class="rating-badge ultimate-hover-effect r-garbage" data-rating-tier="garbage">★ 3.0</span>
            <span class="rating-badge ultimate-hover-effect unrated" data-rating-tier="unrated">NR</span>
        </div>
    </div>

    <!-- SECTION 4: GENRE BADGES -->
    <div class="section">
        <div class="section-title">Genre Badges</div>
        <div class="badge-grid">
            <span class="genre-badge">Action</span>
            <span class="genre-badge">Comedy</span>
            <span class="genre-badge">Romance</span>
            <span class="genre-badge">Sci-Fi</span>
            <span class="genre-badge">Fantasy</span>
            <span class="genre-badge">Slice of Life</span>
            <span class="genre-badge">Supernatural</span>
        </div>
    </div>

    <script>
        const btn = document.getElementById('toggle-theme');
        btn.addEventListener('click', () => {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            btn.textContent = `Thema: ${next === 'dark' ? 'Dark' : 'Light'}`;
        });
    </script>
</body>
</html>
