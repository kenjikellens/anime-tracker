<!-- Main controls: status filters, sort selector, grid/list toggle, size selector -->
<div class="toolbar">
    <!-- Status filters map to anime.status values in `js/app.js` -->
    <div class="filter-group">
        <button class="filter-btn active" data-filter="all">Alles</button>
        <button class="filter-btn" data-filter="airing">Airing</button>
        <button class="filter-btn" data-filter="upcoming">Upcoming</button>
        <button class="filter-btn" data-filter="-1">Te Bekijken</button>
        <button class="filter-btn" data-filter="0">Bezig</button>
        <button class="filter-btn" data-filter="1">Bekeken</button>
    </div>

    <!-- Sort order controls the repository result order before render -->
    <div class="sort-group">
        <select id="sort-select">
            <option value="default">Sorteren: Standaard</option>
            <option value="title-asc">Titel A→Z</option>
            <option value="title-desc">Titel Z→A</option>
            <option value="rating-desc">Beoordeling ↓</option>
            <option value="rating-asc">Beoordeling ↑</option>
            <option value="status">Status</option>
        </select>
    </div>


    <div class="toolbar-right">
        <!-- Grid sizing is only visible while the grid layout is active -->
        <div class="size-toggle" id="size-toggle-container" style="display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 14px; font-weight: 600; color: var(--text-muted); margin-right: 4px;">Grid:</span>
            <button class="size-btn" id="grid-cols-minus" title="Minder kolommen">&minus;</button>
            <span id="grid-cols-val" style="font-size: 16px; font-weight: 700; min-width: 24px; text-align: center; font-family: 'Outfit', sans-serif; color: var(--text);">5</span>
            <button class="size-btn" id="grid-cols-plus" title="Meer kolommen">+</button>
        </div>

        <!-- Grid/list toggle changes the container class in `js/app.js` -->
        <div class="view-toggle">
            <button class="view-btn active" id="grid-btn" title="Grid view"><svg style="width: 1.2em; height: 1.2em; display: inline-block; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><use href="#icon-grid"></use></svg></button>
            <button class="view-btn" id="list-btn" title="List view"><svg style="width: 1.2em; height: 1.2em; display: inline-block; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><use href="#icon-list"></use></svg></button>
        </div>

        <span class="item-count" id="item-count">0 items</span>
    </div>
</div>

<!-- Main content area: filled dynamically by `CardRenderer.renderAll` -->
<main>
    <div id="anime-container" class="grid-view">
        <!-- Dynamically filled by JavaScript -->
    </div>
</main>

<!-- Template used by CardRenderer to populate the anime list dynamically -->
<template id="anime-card-template">
    <div class="anime-card-wrapper">
        <!-- Stack layers will be inserted here dynamically if items > 1 -->
        <div class="anime-card">
            <div class="card-poster"></div>
            <div class="card-info" style="gap: 8px;">
                <div class="card-header">
                    <div class="card-title">
                        <span style="font-size:1.1rem; line-height: 1.2;"></span>
                    </div>
                </div>
                <div class="card-subtitle" style="font-size: 0.85rem; color: var(--text-muted); opacity: 0.8;"></div>
                <div class="card-actions" style="display: flex; gap: 12px; position: absolute; bottom: 8px; right: 8px; z-index: 10; align-items: center;">
                    <div class="avg-rating-text" style="pointer-events: none; color: var(--text-muted);" title="Gemiddelde item-rating">
                        <svg style="width: 1em; height: 1em; display: inline-block; vertical-align: middle; margin-right: 4px;"><use href="#icon-star-half"></use></svg>
                        <span class="avg-rating-val"></span>
                    </div>
                    <div class="rating-badge" style="cursor: pointer; position: relative !important; bottom: auto !important; right: auto !important; z-index: auto !important;" title="Beoordeel deze anime">
                        <svg style="width: 1em; height: 1em; display: inline-block; vertical-align: middle; margin-right: 4px;"><use href="#icon-star"></use></svg>
                        <span class="rating-val"></span>
                    </div>
                </div>
            </div>
            <svg class="expand-icon" style="width: 1.2em; height: 1.2em; vertical-align: middle;"><use href="#icon-chevron-right"></use></svg>
        </div>
    </div>
</template>
