<!-- Main controls: status filters, sort selector, grid/list toggle, size selector -->
<div class="toolbar">
    <div class="filter-group" role="group" aria-label="Statusfilters">
        <button type="button" class="filter-btn active ultimate-hover-effect" data-filter="all">Alles</button>
        <button type="button" class="filter-btn ultimate-hover-effect" data-filter="-1">Te Bekijken</button>
        <button type="button" class="filter-btn ultimate-hover-effect" data-filter="0">Bezig</button>
        <button type="button" class="filter-btn ultimate-hover-effect" data-filter="4">Verder Kijken</button>
        <button type="button" class="filter-btn ultimate-hover-effect" data-filter="1">Bekeken</button>
        <button type="button" class="filter-btn ultimate-hover-effect" id="filter-popup-btn" title="Geavanceerde filters" aria-label="Geavanceerde filters">
            <svg class="svg-icon svg-icon-margin" aria-hidden="true"><use href="#icon-filter"></use></svg>
            <span>Filters</span>
            <span id="filter-active-count" class="filter-count-badge hidden"></span>
        </button>
    </div>

    <div class="sort-group">
        <select id="sort-select" class="app-dropdown ultimate-hover-effect" aria-label="Sorteervolgorde">
            <option value="default">Sorteren: Standaard</option>
            <option value="watch-rank">Mijn Kijkvolgorde (#1 → Laatst)</option>
            <option value="title-asc">Titel A→Z</option>
            <option value="title-desc">Titel Z→A</option>
            <option value="rating-desc">Beoordeling ↓</option>
            <option value="rating-asc">Beoordeling ↑</option>
            <option value="status">Status</option>
            <option value="times-watched-desc">Vaakst Bekeken ↓</option>
            <option value="times-watched-asc">Minst Bekeken ↑</option>
        </select>
    </div>

    <div class="toolbar-right">
        <div class="size-toggle" id="size-toggle-container">
            <span class="size-toggle-label">Raster:</span>
            <button type="button" class="size-btn ultimate-hover-effect" id="grid-cols-minus" title="Minder kolommen" aria-label="Minder kolommen">&minus;</button>
            <span id="grid-cols-val" class="size-val" aria-live="polite">5</span>
            <button type="button" class="size-btn ultimate-hover-effect" id="grid-cols-plus" title="Meer kolommen" aria-label="Meer kolommen">+</button>
        </div>

        <div class="view-toggle" role="group" aria-label="Weergave">
            <button type="button" class="view-btn active ultimate-hover-effect" id="grid-btn" title="Rasterweergave" aria-label="Rasterweergave"><svg class="svg-icon-large" aria-hidden="true"><use href="#icon-grid"></use></svg></button>
            <button type="button" class="view-btn ultimate-hover-effect" id="list-btn" title="Lijstweergave" aria-label="Lijstweergave"><svg class="svg-icon-large" aria-hidden="true"><use href="#icon-list"></use></svg></button>
        </div>

        <span class="item-count" id="item-count" aria-live="polite">0 items</span>
    </div>
</div>

<!-- Main content area: filled dynamically by `CardRenderer.renderAll` -->
<main>
    <div id="general-app-loader" class="general-app-loader" data-visible="true" aria-label="Laden">
        <svg width="48" height="48" class="card-spinner-svg" aria-hidden="true">
            <use href="#icon-spinner"></use>
        </svg>
    </div>
    <div id="anime-container" class="grid-view">
        <!-- Dynamically filled by JavaScript -->
    </div>
</main>

<!-- Template used by CardRenderer to populate the anime list dynamically -->
<template id="anime-card-template">
    <div class="anime-card-wrapper">
        <div class="anime-card ultimate-hover-effect" role="link" tabindex="0">
            <div class="card-poster">
                <div class="card-internal-loader">
                    <svg width="32" height="32" class="card-spinner-svg" aria-hidden="true">
                        <use href="#icon-spinner"></use>
                    </svg>
                </div>
                <div class="card-queue-badge hidden"></div>
            </div>
            <div class="card-info">
                <div class="card-header">
                    <div class="card-title"><span></span></div>
                </div>
                <div class="card-subtitle"></div>
                <div class="card-status-cell"></div>
                <div class="card-actions">
                    <div class="avg-rating-text" title="Gemiddelde item-score">
                        <svg class="svg-icon svg-icon-margin" aria-hidden="true"><use href="#icon-star-half"></use></svg>
                        <span class="avg-rating-val"></span>
                    </div>
                    <button type="button" class="rating-badge rating-actionable ultimate-hover-effect" title="Beoordeel deze anime" aria-label="Beoordeel deze anime">
                        <svg class="svg-icon svg-icon-margin" aria-hidden="true"><use href="#icon-star"></use></svg>
                        <span class="rating-val"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</template>
